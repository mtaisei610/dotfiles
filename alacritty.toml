# ==============================================================================
# Alacritty Configuration File (TOML Format)
# Location: ~/.config/alacritty/alacritty.toml
#
# To "supercharge" your terminal, make sure you have a Nerd Font installed.
# ==============================================================================

[general]
live_config_reload = true
import = [
    "~/.config/alacritty/themes/themes/aura.toml"
]

[terminal]
shell = "/usr/bin/fish"

[window]
# Window padding (blank space between text and window border)
# Adds a sleek, modern breathing room to your text.
# padding = { x = 12, y = 12 }

# Background opacity (0.0 to 1.0)
# A touch of transparency makes your terminal look sophisticated.
# opacity = 0.85

# Window decorations (Full, None, Transparent)
# decorations = "Full"

# Startup mode (Windowed, Maximized, Fullscreen)
startup_mode = "Windowed"

[font]
# Normal (Roman) font face
# We recommend "JetBrainsMono Nerd Font" for a sleek look.
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

# Font size in points
size = 12.0

# Offset is the extra space around each character.
# offset = { x = 0, y = 0 }

[cursor]
# Cursor style (Beam, Underline, Block)
# "Beam" looks very modern and is less intrusive when coding.
style = "Block"

# Vi mode cursor style
vi_mode_style = "Block"

# Blinking interval in milliseconds
# blinking = "On"

